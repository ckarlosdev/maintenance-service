server:
  port: 8087
  error:
    include-message: always

spring:
  application:
    name: maintenance
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"

  datasource:
    url: jdbc:mysql://localhost/maintenance_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: "${SPRING_DATASOURCE_USERNAME:ckarlosTest}"
    password: "${SPRING_DATASOURCE_PASSWORD:tre35g}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /api-docs

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}

logging:
  level:
    org:
      springframework:
        security: DEBUG
        cloud:
          gateway: DEBUG