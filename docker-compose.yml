services:
  db-maintenance:
    image: mysql:8.0
    container_name: db-maintenance
    restart: always
    environment:
      MYSQL_DATABASE: maintenance_db
      MYSQL_ROOT_PASSWORD: ${DB_PASS_ROOT}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "127.0.0.1:3310:3306"
    networks:
      - maintenance-net
    volumes:
      - ./mysql_data:/var/lib/mysql

  maintenance-service:
    build: .
    container_name: maintenance-service
    depends_on:
      - db-maintenance
    restart: always
    ports:
      - "8087:8087"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-maintenance:3306/maintenance_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - APPLICATION_SECURITY_JWT_SECRET_KEY=${JWT_SECRET_KEY}
    networks:
      - maintenance-net

networks:
  maintenance-net:
    driver: bridge